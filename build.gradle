// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        // Kotlin is provided by AGP 9's built-in Kotlin support (bundles KGP 2.2.10);
        // no separate kotlin-gradle-plugin classpath or kotlin-android plugin is needed.
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
